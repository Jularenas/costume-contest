<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concurso de Disfraces</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <script>
    // GitHub Pages caches files for 10 minutes; a fresh query string means
    // every visit gets the latest CSS/JS right after a push.
    window.BUILD = Date.now();
    document.write('<link rel="stylesheet" href="style.css?v=' + BUILD + '">');
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 id="title">🎃 Concurso de Disfraces</h1>
      <p class="stats" id="stats">Cargando…</p>
    </div>
  </header>

  <main class="wrap">
    <div class="mode-banner" id="mode-banner" hidden></div>
    <p class="load-error" id="load-error" role="alert" hidden></p>
    <section class="leader" id="leader" hidden></section>

    <section class="panel">
      <details id="enter" open>
        <summary><h2>Inscribe tu disfraz</h2></summary>
        <form id="entry-form" autocomplete="off" novalidate>
          <label class="photo-drop" id="photo-drop">
            <input type="file" id="photo" accept="image/*" required>
            <img id="preview" alt="" hidden>
            <span id="photo-hint">📷 Toca para agregar una foto</span>
          </label>
          <div class="fields">
            <label><span>Nombre del disfraz</span>
              <input id="name" maxlength="60" placeholder="ej. Esqueleto Tenebroso" required>
            </label>
            <label><span>Tu nombre <span class="opt">(opcional)</span></span>
              <input id="entrant" maxlength="60" placeholder="ej. Camila">
            </label>
            <div id="matches" class="matches" hidden></div>
            <button type="submit" class="primary" id="submit">Publicar disfraz</button>
            <p class="error" id="form-error" role="alert"></p>
          </div>
        </form>
      </details>
    </section>

    <section>
      <div class="gallery-head">
        <h2>Vota por el mejor disfraz</h2>
        <input type="search" id="search" placeholder="Buscar un disfraz…" aria-label="Buscar un disfraz">
      </div>
      <p class="hint">Tienes un solo voto. ¿Cambiaste de opinión? Toca otro disfraz para mover tu voto.</p>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Aún no hay disfraces. ¡Sé el primero en participar!</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    for (const f of ['config.js', 'decor.js', 'store.js', 'app.js']) {
      document.write('<script src="' + f + '?v=' + BUILD + '"><\/script>');
    }
  </script>
</body>
</html>
